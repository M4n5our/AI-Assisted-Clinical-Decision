server.port=8080

# MySQL configuration (primary)
spring.datasource.url=jdbc:mysql://localhost:3306/cdss_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JSON serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# Model service URL
cdss.model-service.url=http://localhost:8000

# JWT Configuration
jwt.secret=cdss-jwt-secret-key-must-be-at-least-32-characters-long
jwt.expiration-ms=86400000
